# configs/live.toml plus Qwen3 Embedding: the lexical search hits for the task
# text are ordered by their similarity to the task before the best
# preload_results of them go into the first prompt. Unmeasured; compare with
# live.toml on the same dev seed. tests/test_config.py keeps everything
# outside [embedding] equal to live.toml. With OPENROUTER_API_KEY set the
# model is qwen/qwen3-embedding-8b at the small model's address.
[model]
provider = "openai"
response_format = "json_object"
input_usd_per_million = 0.20
output_usd_per_million = 0.40
extra_body = { usage = { include = true }, provider = { order = ["deepinfra/fp8", "crusoe", "novita"], only = ["deepinfra/fp8", "crusoe", "novita"], allow_fallbacks = true } }

[jev]
enabled = false
model = "jev-1.14.0"
base_url = "https://api.typesafe.ai/v1/systemone"
threshold = 0.7

[embedding]
enabled = true
# Lexical hits that are embedded per task: one request, input tokens only.
candidates = 20
input_usd_per_million = 0.01     # OpenRouter's list price, not the scored cost.
# dimensions = 256               # Shorter vectors, if the endpoint accepts the field.

[agent]
preload_results = 5
inventory = true
preload_documents_under = 40
tools = ["search", "read", "table", "after", "calculate", "decode", "iocs", "graph"]
playbooks = "hacklab.event.playbooks:playbooks"
rules = "hacklab.event:arena-rules.md"
on_unverified = "answer"

[guard]
injection = "flag"
compact_secrets = true
decode_previews = true
require_grounded_targets = true
max_actions = 200

[limits]
max_steps = 12
max_calls = 24
max_retries = 1
http_retries = 3
timeout_seconds = 60
task_timeout_seconds = 300
max_context_chars = 48000
max_observation_chars = 4000
max_output_tokens = 3000
max_total_tokens = 600000

[cache]
mode = "off"
