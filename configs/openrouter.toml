# The event's small model, Gemma 4 31B, through OpenRouter:
# SMALL_MODEL_NAME=google/gemma-4-31b-it, URL and key in .env. Prices are what
# OpenRouter's customers paid on average on 14 November 2026; its providers
# list $0.10 to $0.38 per million input tokens and $0.34 to $1.15 output. Not
# the event's tariff.
#
# [agent] and [limits] were measured on 13 November with IBM Granite 4.2 8B
# ($0.06 / $0.15, reasoning "low"), the stand-in before the model was known:
# docs/benchmarks.md. Nothing in this file is measured on Gemma 4 yet.
[model]
provider = "openai"
response_format = "json_object"
input_usd_per_million = 0.1245
output_usd_per_million = 0.3932
# Thinking is billed as output. Gemma 4 does not think unless asked, so "none"
# is what an endpoint without settings does. On Granite, "low" needed fewer
# calls and cost less than half of "none"; measure it on Gemma before keeping
# either.
extra_body = { reasoning = { effort = "none" } }

[jev]
enabled = false

[agent]
preload_results = 5
inventory = true
preload_documents_under = 40
skills = "hacklab.event:skills"
tools = ["search", "read", "table", "after", "calculate", "decode", "iocs", "graph"]

[guard]
allowed_actions = ["quarantine_agent", "revoke_token", "takedown_dataset"]
protected_targets = ["hub-scanner"]
max_actions = 200

[limits]
max_steps = 8
max_calls = 16
max_retries = 1
http_retries = 3
timeout_seconds = 60
task_timeout_seconds = 300
max_context_chars = 24000
max_output_tokens = 3000
max_total_tokens = 120000

# The temporary key is capped at 3 USD; stop well before that.
[budget]
max_usd = 2.0
