[project]
name = "hacklab"
version = "0.1.0"
description = "Local small-model agent lab with reproducible benchmarks and honest cost tracking"
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
hacklab = "hacklab.cli:main"
hacklab-dev = "hacklab.devtools:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
